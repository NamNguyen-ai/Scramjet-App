# Ports 8080 (Scramjet HTTP) and 8081 (Neko remote browser) are published to the host.
# The wireproxy SOCKS5 listeners (port 25344, internal) stay on the
# "scramjet-egress" docker network and are addressed by service name.

# Shared base for wireproxy sidecars: each peer differs only by the
# WireGuard config it mounts. All three reference the same `image:` tag so
# docker compose builds wireproxy ONCE and reuses the result for peers 2/3
# instead of rebuilding the Go binary three times.
x-wireproxy-base: &wireproxy-base
  image: scramjet-wireproxy:local
  build: ./wireproxy
  restart: unless-stopped
  networks:
    - egress
  cap_add:
    - NET_ADMIN

services:
  scramjet:
    build: .
    container_name: scramjet
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      WIREPROXY_SOCKS: ${WIREPROXY_SOCKS:-}
    depends_on:
      - wireproxy1
      - wireproxy2
      - wireproxy3
    networks:
      - egress

  neko:
    image: ghcr.io/m1k1o/neko/chromium:latest
    container_name: neko
    restart: unless-stopped
    shm_size: "2gb"
    cap_add:
      - SYS_ADMIN
    ports:
      - "8081:8080"
    environment:
      NEKO_DESKTOP_SCREEN: "1920x1080@30"
      # No in-app auth; access is gated by GitHub forwarded-port = Private.
      NEKO_MEMBER_PROVIDER: "multiuser"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: ${NEKO_USER_PASSWORD:-neko}
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: ${NEKO_ADMIN_PASSWORD:-admin}
      # Single-viewer use: any logged-in session controls mouse/keyboard
      # immediately. Default (false) only lets an explicit host inject input,
      # so a plain user sees the stream but can't move the cursor.
      NEKO_SESSION_IMPLICIT_HOSTING: "true"
      # ICE servers = Cloudflare TURN (minted by start.sh). ICELITE MUST be 0
      # when supplying ICE servers.
      NEKO_WEBRTC_ICELITE: "0"
      NEKO_WEBRTC_ICESERVERS_FRONTEND: ${NEKO_WEBRTC_ICESERVERS_FRONTEND:-[]}
      NEKO_WEBRTC_ICESERVERS_BACKEND: ${NEKO_WEBRTC_ICESERVERS_BACKEND:-[]}
      NEKO_WEBRTC_TCPMUX: "59000"
      # Chromium egress. Default is DIRECT (Codespace IP, full bandwidth) —
      # Probe 3 showed the Pi Zero W residential exit can't sustain 1080p.
      # Set NEKO_EGRESS_SOCKS to route through a SOCKS exit; empty = no proxy flag.
      NEKO_DESKTOP_CHROMIUM_FLAGS: ${NEKO_EGRESS_SOCKS:+--proxy-server=socks5://${NEKO_EGRESS_SOCKS}}
    networks:
      - egress

  wireproxy1:
    <<: *wireproxy-base
    container_name: wireproxy1
    volumes:
      - ./wg-configs/peer1.conf:/etc/wireproxy/config:ro

  wireproxy2:
    <<: *wireproxy-base
    container_name: wireproxy2
    volumes:
      - ./wg-configs/peer2.conf:/etc/wireproxy/config:ro

  wireproxy3:
    <<: *wireproxy-base
    container_name: wireproxy3
    volumes:
      - ./wg-configs/peer3.conf:/etc/wireproxy/config:ro

networks:
  egress:
    name: scramjet-egress
